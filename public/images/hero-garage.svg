<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="Finished epoxy garage floor in soft natural light">
  <!-- IMAGE PROMPT: A pristine residential garage with a glossy flake-epoxy floor
       in warm tan and cream tones, soft morning light streaming through an open
       door, minimalist staging, high-end and clean. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#ece2d1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ddc9a9"/>
      <stop offset="1" stop-color="#cbb088"/>
    </linearGradient>
    <radialGradient id="light" cx="0.7" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#wall)"/>
  <polygon points="0,640 1600,560 1600,1100 0,1100" fill="url(#floor)"/>
  <polygon points="0,640 1600,560 1600,700 0,780" fill="#b6936a" opacity="0.25"/>
  <rect width="1600" height="1100" fill="url(#light)"/>
  <g fill="#98774f" opacity="0.12">
    <circle cx="300" cy="900" r="6"/><circle cx="520" cy="820" r="5"/>
    <circle cx="780" cy="950" r="6"/><circle cx="1050" cy="860" r="5"/>
    <circle cx="1300" cy="980" r="6"/><circle cx="650" cy="1010" r="5"/>
  </g>
</svg>
